name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Apache Arrow version, or latest for the newest stable release"
        default: latest
        required: false
        type: string
      build:
        description: "Optional post-release build number (e.g. 1 -> .post1)"
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda.yaml
          channels: conda-forge,nodefaults
          activate-environment: arx-arrowcpp-sources
          auto-update-conda: true
          conda-solver: libmamba
          python-version: "3.13"

      # Resolve before installing so Poetry sees the matching PyArrow lock.
      - name: Synchronize with Apache Arrow
        id: version
        env:
          ARROW_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build }}
        run: |
          bash scripts/versioning.sh "${ARROW_VERSION:-latest}" "${BUILD_NUMBER:-}"
          poetry check --lock

      - name: Check whether the version is already published
        id: pypi
        run: python scripts/versioning.py --check-published

      - name: Install dependencies
        if: steps.pypi.outputs.published != 'true'
        run: poetry install --with dev

      - name: Generate Apache Arrow C++ source bundle
        if: steps.pypi.outputs.published != 'true'
        run: python scripts/build_bundle.py

      - name: Run tests
        if: steps.pypi.outputs.published != 'true'
        run: pytest -q

      - name: Build package
        if: steps.pypi.outputs.published != 'true'
        run: |
          rm -rf dist
          poetry build

      - name: Smoke test installed wheel with matching PyArrow
        if: steps.pypi.outputs.published != 'true'
        run: |
          python -m venv /tmp/arx-arrowcpp-wheel-smoke
          /tmp/arx-arrowcpp-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/arx-arrowcpp-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/arx-arrowcpp-wheel-smoke/bin/python scripts/smoke_test_installed.py

      - name: Publish to PyPI
        if: steps.pypi.outputs.published != 'true'
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish

      # Run even when PyPI already has the version, to recover interrupted runs.
      - name: Commit synchronized release metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add pyproject.toml poetry.lock README.md src/arx_arrowcpp_sources/_version.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Release ${RELEASE_VERSION}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUNDLED_VERSION: ${{ steps.version.outputs.bundled_version }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if ! git show-ref --verify --quiet "refs/tags/${TAG}"; then
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --repo "${GITHUB_REPOSITORY}" \
              --title "Release ${RELEASE_VERSION}" \
              --notes "Bundle Apache Arrow C++ ${BUNDLED_VERSION} with matching PyArrow."
          fi
